name: SOPS CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore OrderingSystem.sln

      - name: Build
        run: dotnet build OrderingSystem.sln -c Release --no-restore

      - name: Test
        run: dotnet test OrderingSystem.sln -c Release --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build-test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t sops-api:${{ github.sha }} .
